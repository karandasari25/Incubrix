[project]
name = "incubrix"
version = "0.1.0"
description = "IncuBrix long-tail distribution network"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "celery>=5.4,<6",
  "redis>=6.1.0,<7.1",
  "httpx>=0.27,<1",
  "minio>=7.2,<8",
  "pyyaml>=6.0,<7",
  "PyJWT>=2.8,<3",
  
]

[project.optional-dependencies]
test = [
  "pytest>=8.2,<9",
  "pytest-cov>=5.0,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[project.scripts]
incubrix-batch = "app.batch:main"
