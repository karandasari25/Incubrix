key: ghost
version: 1.0.0
tier: native
auth: api_key
surfaces:
  - key: post
    content_types: [text, link, image]
    spec:
      title_max_chars: 300
      body_max_chars: 100000
      links_allowed: true
rate_limits:
  per_connection:
    requests: 30
    per_seconds: 60
capabilities: [publish, status, delete, metrics]
error_map:
  "400": PLATFORM_CONTENT_REJECTED
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
  "422": PLATFORM_CONTENT_REJECTED
  "429": PLATFORM_RATE_LIMIT
  "500": PLATFORM_UNAVAILABLE
  "502": PLATFORM_UNAVAILABLE
  "503": PLATFORM_UNAVAILABLE
  "504": PLATFORM_UNAVAILABLE
  "timeout": PLATFORM_UNAVAILABLE
  "quota": PLATFORM_QUOTA_EXHAUSTED
instance_param: base_url
