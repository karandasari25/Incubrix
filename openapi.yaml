openapi: 3.1.0
info:
  title: IncuBrix
  version: 0.1.0
paths:
  /:
    get:
      summary: Root
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Root  Get
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
  /ready:
    get:
      summary: Ready
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Ready Ready Get
  /api/v1/publish:
    post:
      summary: Publish
      operationId: publish_api_v1_publish_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/app__schemas__PublishRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Publish Api V1 Publish Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}:
    get:
      summary: Get Job
      operationId: get_job_api_v1_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Job Api V1 Jobs  Job Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/destinations:
    get:
      summary: List Destinations
      operationId: list_destinations_api_v1_destinations_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response List Destinations Api V1 Destinations Get
    post:
      summary: Create Destination
      operationId: create_destination_api_v1_destinations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Create Destination Api V1 Destinations Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/certification:
    post:
      summary: Certification
      operationId: certification_api_v1_certification_post
      parameters:
      - name: destination_id
        in: query
        required: true
        schema:
          type: string
          title: Destination Id
      - name: run_type
        in: query
        required: true
        schema:
          type: string
          title: Run Type
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Certification Api V1 Certification Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/catalogue/import:
    post:
      summary: Catalogue Import
      operationId: catalogue_import_api_v1_catalogue_import_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogueImportRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Catalogue Import Api V1 Catalogue Import Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ai/rules/capture:
    post:
      summary: Capture Ai Rules
      operationId: capture_ai_rules_api_v1_ai_rules_capture_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIRulesCaptureRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Capture Ai Rules Api V1 Ai Rules Capture Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/certification/due:
    get:
      summary: Certification Due
      operationId: certification_due_api_v1_certification_due_get
      parameters:
      - name: interval_days
        in: query
        required: false
        schema:
          type: integer
          default: 30
          title: Interval Days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Certification Due Api V1 Certification Due Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/recommendations:
    post:
      summary: Get Recommendations
      operationId: get_recommendations_api_v1_recommendations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Recommendations Api V1 Recommendations Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /connector/v1/{connector_key}/validate:
    post:
      summary: Validate
      operationId: validate_connector_v1__connector_key__validate_post
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /connector/v1/{connector_key}/publish:
    post:
      summary: Publish
      operationId: publish_connector_v1__connector_key__publish_post
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/app__connectors__router__PublishRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /connector/v1/{connector_key}/get_status:
    post:
      summary: Get Status
      operationId: get_status_connector_v1__connector_key__get_status_post
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /connector/v1/{connector_key}/delete:
    post:
      summary: Delete
      operationId: delete_connector_v1__connector_key__delete_post
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /connector/v1/{connector_key}/fetch_metrics:
    post:
      summary: Fetch Metrics
      operationId: fetch_metrics_connector_v1__connector_key__fetch_metrics_post
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /connector/v1/{connector_key}/refresh_auth:
    post:
      summary: Refresh Auth
      operationId: refresh_auth_connector_v1__connector_key__refresh_auth_post
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /connector/v1/{connector_key}/build_assist_pack:
    post:
      summary: Build Assist Pack
      operationId: build_assist_pack_connector_v1__connector_key__build_assist_pack_post
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AIRulesCaptureRequest:
      properties:
        text:
          type: string
          title: Text
      type: object
      required:
      - text
      title: AIRulesCaptureRequest
    AssistRequest:
      properties:
        rendition:
          additionalProperties: true
          type: object
          title: Rendition
        destination:
          additionalProperties: true
          type: object
          title: Destination
      type: object
      title: AssistRequest
    AuthRequest:
      properties:
        connection:
          additionalProperties: true
          type: object
          title: Connection
      type: object
      title: AuthRequest
    CatalogueImportRequest:
      properties:
        csv_path:
          type: string
          title: Csv Path
      type: object
      required:
      - csv_path
      title: CatalogueImportRequest
    DestinationCreate:
      properties:
        name:
          type: string
          title: Name
        url:
          type: string
          title: Url
        platform_key:
          type: string
          title: Platform Key
        surface:
          type: string
          title: Surface
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
        audience_tags:
          items:
            type: string
          type: array
          title: Audience Tags
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
        geo:
          anyOf:
          - type: string
          - type: 'null'
          title: Geo
        est_audience:
          anyOf:
          - type: integer
          - type: 'null'
          title: Est Audience
        rules_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Rules Url
        frequency_cap:
          anyOf:
          - type: string
          - type: 'null'
          title: Frequency Cap
        self_promo_allowed:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Self Promo Allowed
        link_policy:
          anyOf:
          - type: string
          - type: 'null'
          title: Link Policy
        disclosure_required:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Disclosure Required
        automation_allowed:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Automation Allowed
        connector_key:
          type: string
          title: Connector Key
        relevance_score:
          anyOf:
          - type: integer
            maximum: 5.0
            minimum: 1.0
          - type: 'null'
          title: Relevance Score
        relevance_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Relevance Reason
        level:
          type: string
          title: Level
          default: L0
      type: object
      required:
      - name
      - url
      - platform_key
      - surface
      - connector_key
      title: DestinationCreate
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    MetricsRequest:
      properties:
        platform_post_id:
          type: string
          title: Platform Post Id
        connection:
          additionalProperties: true
          type: object
          title: Connection
        since:
          type: string
          title: Since
          default: ''
      type: object
      required:
      - platform_post_id
      title: MetricsRequest
    PostRequest:
      properties:
        platform_post_id:
          type: string
          title: Platform Post Id
        connection:
          additionalProperties: true
          type: object
          title: Connection
      type: object
      required:
      - platform_post_id
      title: PostRequest
    RecommendationRequest:
      properties:
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        body:
          anyOf:
          - type: string
          - type: 'null'
          title: Body
        canonical_link:
          anyOf:
          - type: string
          - type: 'null'
          title: Canonical Link
        tags:
          items:
            type: string
          type: array
          title: Tags
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
          default: en
        is_promotional:
          type: boolean
          title: Is Promotional
          default: false
        ai_generated:
          type: boolean
          title: Ai Generated
          default: false
      type: object
      title: RecommendationRequest
    ValidateRequest:
      properties:
        rendition:
          additionalProperties: true
          type: object
          title: Rendition
        destination:
          additionalProperties: true
          type: object
          title: Destination
        connection:
          additionalProperties: true
          type: object
          title: Connection
      type: object
      title: ValidateRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    app__connectors__router__PublishRequest:
      properties:
        rendition:
          additionalProperties: true
          type: object
          title: Rendition
        destination:
          additionalProperties: true
          type: object
          title: Destination
        connection:
          additionalProperties: true
          type: object
          title: Connection
        idempotency_key:
          type: string
          title: Idempotency Key
      type: object
      required:
      - idempotency_key
      title: PublishRequest
    app__schemas__PublishRequest:
      properties:
        destinations:
          items:
            type: string
          type: array
          title: Destinations
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        body:
          anyOf:
          - type: string
          - type: 'null'
          title: Body
        canonical_link:
          anyOf:
          - type: string
          - type: 'null'
          title: Canonical Link
        tags:
          items:
            type: string
          type: array
          title: Tags
        is_promotional:
          type: boolean
          title: Is Promotional
          default: false
        ai_generated:
          type: boolean
          title: Ai Generated
          default: false
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
      type: object
      title: PublishRequest
